services:
  db:
    image: postgres:16-alpine
    container_name: salary-db
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary
    ports:
      - "5432:5432"
    volumes:
      - salary_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary"]
      interval: 3s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:16-alpine
    container_name: salary-db-test
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  salary_db_data:
