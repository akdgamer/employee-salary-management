# Render blueprint for the API. The database is Neon (see docs/deployment.md).
services:
  - type: web
    name: salary-management-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon direct (non-pooled) connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://salary-management.vercel.app
